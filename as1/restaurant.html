<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/common.css">

<body>

    <header class="header">
        <div class="header-container">
            <a href="index.html" class="logo">
                <img src="images/romaliya-logo.png" alt="Romaliya Logo" class="logo-img">
            </a>

            <nav class="nav">

            <div class="elegance-grid">
