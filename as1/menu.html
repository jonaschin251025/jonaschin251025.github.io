<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Romaliya Restaurant</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/menu.css">
</head>

<body>

    <header class="header">
        <div class="header-container">
            <a href="index.html">
                <img src="images/romaliya-logo.png" alt="Romaliya Logo" class="logo-img">
            </a>

            <nav class="nav">
                <a href="index.html" class="nav-link">Home</a>
                <a href="menu.html" class="nav-link active">Menu</a>
                <a href="order.html" class="nav-link">Order</a>
                <a href="promotion.html" class="nav-link">Promotion</a>
                <a href="about.html" class="nav-link">About Us</a>
                <a href="restaurant.html" class="nav-link">Our Restaurant</a>
                <a href="order.html">
                    <img src="images/order-icon.png" alt="Order Icon" class="order-icon">
                </a>
            </nav>

            <button class="menu-toggle">
                <img src="images/hamburger.png" alt="Menu Icon" class="menu-icon">
            </button>
        </div>
    </header>

    <main>
        <!-- === MENU HERO SECTION === -->
        <section class="menu-hero">
            <div class="menu-hero-content">
                <p class="eyebrow-heading">CHEF'S</p>
                <h1>RECOMMENDATION</h1>
            </div>
        </section>

        <!-- === RECOMMENDATIONS CARDS === -->
        <section class="recommendations-section">
            <div class="recommendation-card recommendation-lobster">
                <h4>BUTTER-POACHED LOBSTER</h4>
            </div>

            <div class="recommendation-card recommendation-chocolate">
                <h4>CHOCOLATE BALL ON CAKE</h4>
            </div>

            <div class="recommendation-card recommendation-duck">
                <h4>DUCK BREAST WITH CHERRY SAUCE</h4>
            </div>
        </section>

        <!-- === FOOTER === -->
        <footer class="footer">
            <div class="footer-content">
                <img src="images/romaliya-logo.png" alt="Romaliya Logo" class="footer-logo">
                <p class="footer-desc">
                    From the first welcome to the last bite, every detail is designed to create a<br>memorable dining
                    experience for you and your loved ones.
                </p>

                <div class="footer-socials">
                    <a href="https://www.facebook.com/" class="social-btn" target="_blank">
                        <img src="images/facebook.png" alt="Facebook">
                    </a>
                    <a href="https://x.com/" class="social-btn" target="_blank">
                        <img src="images/twitter.png" alt="Twitter">
                    </a>
                    <a href="https://www.instagram.com/" class="social-btn" target="_blank">
                        <img src="images/instagram.png" alt="Instagram">
                    </a>
                    <a href="https://www.youtube.com/" class="social-btn" target="_blank">
                        <img src="images/youtube.png" alt="YouTube">
                    </a>
                </div>
            </div>
        </footer>
</body>

</html>
