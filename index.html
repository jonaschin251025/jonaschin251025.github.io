<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Page</title>
    <link rel="stylesheet" href="css/index.css">
</head>

<body>

    <header>
        <div class="logo">LOGO</div>
        <div class="header-socials">
            <a href="https://twitter.com" target="_blank"><img src="images/twitter.png" alt="Twitter"></a>
            <a href="https://instagram.com" target="_blank"><img src="images/instagram.png" alt="Instagram"></a>
            <a href="https://youtube.com" target="_blank"><img src="images/youtube.png" alt="YouTube"></a>
        </div>
    </header>

    <main class="content">
        <div class="profile-section">
            <img src="images/profile.jpg" alt="Profile Picture" class="profile-img">
            <h1>Jonas</h1>
            <p class="occupation">Digital Media Student</p>
            <p class="self-introduction">
                Hello! I'm Jonas, a Digital Media Diploma student. I love graphic design, web development, and
                interactive media. Welcome to my personal page!
            </p>
        </div>
    </main>

    <footer>
        <div class="footer-socials">
            <a href="https://twitter.com" target="_blank"><img src="images/twitter.png" alt="Twitter"></a>
            <a href="https://instagram.com" target="_blank"><img src="images/instagram.png" alt="Instagram"></a>
            <a href="https://youtube.com" target="_blank"><img src="images/youtube.png" alt="YouTube"></a>
        </div>
        <p class="disclaimer">2024 Jonas. All rights reserved.</p>
    </footer>

</body>

</html>
