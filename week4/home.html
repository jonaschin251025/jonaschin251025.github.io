<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise2</title>
    <link rel="stylesheet" href="css/home.css" />
</head>

<body>

    <header>
        <div>
            <img src="images/positivus_logo.png" alt="Logo" class="header-logo">
        </div>

        <div class="navigation-links">
            <a>About us</a>
            <a>Services</a>
            <a>Use Cases</a>
            <a>Pricing</a>
            <a>Blog</a>
            <button class="quote-btn">Request a quote</button>
        </div>

        <div class="hamburger-menu">
            <img src="images/hamburger.png" alt="hamburger" width="40px">
        </div>


    </header>

    <div class="hero-container">
        <div class="paragraph-description">
            <h1>Navigating the digital landscape for success</h1>
            <p>Our digital marketing agency helps businesses grow and succeed online through a range of services
                including SEO, PPC, social media marketing, and content creation.</p>
            <button class="consult-btn">Book a free consultation</button>
        </div>

        <div class="illustration-container">
            <img src="images/megaphone.png" alt="Illustration" class="illustration">
        </div>
    </div>

    <div class="logos-container">
        <img src="images/amazon_logo.png" alt="Amazon" class="partner-logo">
        <img src="images/dribble_logo.png" alt="Dribbble" class="partner-logo">
        <img src="images/hubspot_logo.png" alt="HubSpot" class="partner-logo">
        <img src="images/notion_logo.png" alt="Notion" class="partner-logo">
        <img src="images/netflix_logo.png" alt="Netflix" class="partner-logo">
        <img src="images/zoom_logo.png" alt="Zoom" class="partner-logo">
    </div>


</body>

</html>
